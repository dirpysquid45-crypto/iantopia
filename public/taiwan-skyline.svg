<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes twinkle {
        0%, 100% { opacity: 0.8; }
        50% { opacity: 0.3; }
      }
      .star { animation: twinkle 3s ease-in-out infinite; }
      .star1 { animation-delay: 0s; }
      .star2 { animation-delay: 0.5s; }
      .star3 { animation-delay: 1s; }
      .star4 { animation-delay: 1.5s; }
      .star5 { animation-delay: 2s; }
      .star6 { animation-delay: 0.2s; }
      .star7 { animation-delay: 0.7s; }
    </style>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(26,10,46,0.1);stop-opacity:0.1"/>
      <stop offset="40%" style="stop-color:rgba(139,77,166,0.15);stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:rgba(212,116,107,0.3);stop-opacity:0.3"/>
    </linearGradient>
    <linearGradient id="buildingGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="50%" style="stop-color:#0f0f1e"/>
      <stop offset="100%" style="stop-color:#151525"/>
    </linearGradient>
  </defs>

  <!-- Sky gradient overlay -->
  <rect width="1200" height="280" fill="url(#skyGradient)"/>

  <!-- Stars - more scattered for depth -->
  <g class="star star1"><circle cx="100" cy="60" r="2" fill="#ffeb3b" opacity="0.9"/></g>
  <g class="star star2"><circle cx="180" cy="40" r="1.5" fill="#fff" opacity="0.7"/></g>
  <g class="star star3"><circle cx="320" cy="90" r="1" fill="#fff" opacity="0.6"/></g>
  <g class="star star4"><circle cx="520" cy="50" r="2" fill="#ffeb3b" opacity="0.85"/></g>
  <g class="star star5"><circle cx="750" cy="100" r="1.5" fill="#fff" opacity="0.8"/></g>
  <g class="star star6"><circle cx="950" cy="45" r="1" fill="#fff" opacity="0.7"/></g>
  <g class="star star7"><circle cx="1080" cy="70" r="2" fill="#ffeb3b" opacity="0.9"/></g>

  <!-- Taipei 101 - The iconic skyscraper -->
  <g id="taipei101">
    <!-- Main tower body -->
    <polygon points="220,280 250,280 248,120 222,120" fill="#1a1a2e" stroke="#0a0a1a" stroke-width="0.5"/>
    <!-- Segmented sections (Taipei 101 has 8 sections) -->
    <line x1="222" y1="160" x2="248" y2="160" stroke="#0a0a1a" stroke-width="0.5" opacity="0.5"/>
    <line x1="222" y1="195" x2="248" y2="195" stroke="#0a0a1a" stroke-width="0.5" opacity="0.5"/>
    <line x1="222" y1="230" x2="248" y2="230" stroke="#0a0a1a" stroke-width="0.5" opacity="0.5"/>
    <!-- Spire -->
    <polygon points="235,120 232,80 238,80" fill="#0f0f1a" stroke="#050505" stroke-width="0.5"/>
    <!-- Tower lights -->
    <rect x="225" y="125" width="2" height="6" fill="#ffcc00" opacity="0.8"/>
    <rect x="243" y="140" width="2" height="6" fill="#ffcc00" opacity="0.7"/>
    <rect x="225" y="180" width="2" height="4" fill="#ff6b35" opacity="0.6"/>
  </g>

  <!-- Mid-rise building cluster (center-left) -->
  <g id="buildings-left">
    <!-- Building 1 -->
    <rect x="40" y="240" width="45" height="70" fill="#1f1f2e" stroke="#0a0a1a" stroke-width="0.5"/>
    <circle cx="50" cy="250" r="1.5" fill="#ffcc00" opacity="0.5"/>
    <circle cx="50" cy="265" r="1.5" fill="#ffcc00" opacity="0.4"/>
    <circle cx="70" cy="250" r="1.5" fill="#ffcc00" opacity="0.5"/>
    <circle cx="70" cy="280" r="1.5" fill="#ff9900" opacity="0.4"/>

    <!-- Building 2 -->
    <rect x="90" y="260" width="35" height="50" fill="#232333" stroke="#0a0a1a" stroke-width="0.5"/>
    <circle cx="100" cy="270" r="1" fill="#ffcc00" opacity="0.5"/>
    <circle cx="110" cy="285" r="1" fill="#ff9900" opacity="0.4"/>
  </g>

  <!-- Central cluster (major buildings) -->
  <g id="buildings-center">
    <!-- Modern glass building -->
    <rect x="150" y="220" width="50" height="90" fill="#0a1a2e" stroke="#1a2a3e" stroke-width="1"/>
    <circle cx="165" cy="235" r="1" fill="#4ca3ff" opacity="0.6"/>
    <circle cx="175" cy="250" r="1" fill="#4ca3ff" opacity="0.5"/>
    <circle cx="185" cy="270" r="1" fill="#4ca3ff" opacity="0.6"/>
    <circle cx="165" cy="290" r="1" fill="#4ca3ff" opacity="0.4"/>

    <!-- Building cluster -->
    <rect x="270" y="245" width="40" height="65" fill="#1a1a2e" stroke="#0a0a1a" stroke-width="0.5"/>
    <circle cx="280" cy="260" r="1.2" fill="#ffbb00" opacity="0.6"/>
    <circle cx="295" cy="275" r="1.2" fill="#ffbb00" opacity="0.5"/>

    <!-- Tall building -->
    <rect x="360" y="200" width="45" height="110" fill="#151525" stroke="#0a0a1a" stroke-width="0.5"/>
    <circle cx="375" cy="220" r="1.5" fill="#ffcc00" opacity="0.6"/>
    <circle cx="390" cy="245" r="1.5" fill="#ffcc00" opacity="0.5"/>
    <circle cx="375" cy="280" r="1" fill="#ff9900" opacity="0.5"/>
  </g>

  <!-- Right side buildings -->
  <g id="buildings-right">
    <!-- Modern high-rise -->
    <rect x="550" y="235" width="55" height="75" fill="#1a2a3e" stroke="#0a1a2e" stroke-width="0.5"/>
    <circle cx="565" cy="250" r="1.3" fill="#00d4ff" opacity="0.6"/>
    <circle cx="580" cy="270" r="1.3" fill="#00d4ff" opacity="0.5"/>
    <circle cx="595" cy="280" r="1.3" fill="#00ccff" opacity="0.5"/>

    <!-- Mid-rise -->
    <rect x="650" y="270" width="35" height="40" fill="#1f1f2e" stroke="#0a0a1a" stroke-width="0.5"/>
    <circle cx="660" cy="285" r="1" fill="#ffbb00" opacity="0.5"/>

    <!-- Tall tower -->
    <rect x="750" y="190" width="42" height="120" fill="#0f1a2a" stroke="#0a0a1a" stroke-width="0.5"/>
    <circle cx="765" cy="210" r="1.5" fill="#00ffff" opacity="0.6"/>
    <circle cx="780" cy="240" r="1.5" fill="#00ffff" opacity="0.5"/>
    <circle cx="765" cy="280" r="1.2" fill="#00ccff" opacity="0.4"/>
  </g>

  <!-- Far right buildings -->
  <g id="buildings-far-right">
    <!-- Modern cluster -->
    <rect x="870" y="255" width="40" height="55" fill="#1a1a2e" stroke="#0a0a1a" stroke-width="0.5"/>
    <circle cx="885" cy="270" r="1.2" fill="#ffbb00" opacity="0.5"/>
    <circle cx="900" cy="290" r="1.2" fill="#ff9900" opacity="0.4"/>

    <!-- Tall building -->
    <rect x="960" y="220" width="38" height="90" fill="#151520" stroke="#0a0a1a" stroke-width="0.5"/>
    <circle cx="975" cy="240" r="1.3" fill="#ffcc00" opacity="0.6"/>
    <circle cx="990" cy="265" r="1.3" fill="#ffcc00" opacity="0.5"/>
    <circle cx="975" cy="290" r="1" fill="#ff9900" opacity="0.4"/>

    <!-- Modern glass -->
    <rect x="1050" y="260" width="35" height="50" fill="#0a1a3e" stroke="#1a2a4e" stroke-width="0.5"/>
    <circle cx="1063" cy="275" r="1" fill="#00d4ff" opacity="0.5"/>
  </g>

  <!-- Distant buildings (hazier, smaller) -->
  <g id="buildings-distant" opacity="0.7">
    <rect x="310" y="290" width="20" height="30" fill="#2a2a3e"/>
    <rect x="450" y="295" width="18" height="25" fill="#2a2a3e"/>
    <rect x="680" y="300" width="22" height="20" fill="#2a2a3e"/>
    <rect x="820" y="305" width="20" height="15" fill="#2a2a3e"/>
  </g>

  <!-- City lights glow (bottom city section) -->
  <rect x="0" y="310" width="1200" height="490" fill="#0a0a1a"/>

  <!-- Reflection glow from lights -->
  <ellipse cx="600" cy="320" rx="400" ry="80" fill="#ffcc00" opacity="0.05"/>
</svg>
