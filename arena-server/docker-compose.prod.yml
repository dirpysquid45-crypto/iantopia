version: '3.8'

services:
  arena-server:
    build: .
    container_name: iantopia-arena-server
    restart: unless-stopped
    networks:
      - iantopia-network
    ports:
      - "127.0.0.1:4001:4001"
    volumes:
      - ./service-account-key.json:/app/service-account-key.json:ro
    environment:
      - NODE_ENV=production
      - PORT=4001
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD", "node", "-e", "require('ws').connect('ws://localhost:4001')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  iantopia-network:
    driver: bridge
