version: '3.8'

services:
  arena-server:
    build: .
    container_name: iantopia-arena-server
    restart: unless-stopped
    networks:
      - iantopia-network
      - yt-network
    ports:
      - "127.0.0.1:4001:4001"
    volumes:
      - ./service-account-key.json:/app/service-account-key.json:ro
      - ../public:/public:ro
    environment:
      - NODE_ENV=production
      - PORT=4001
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      # This compose-level healthcheck overrides the Dockerfile's own
      # HEALTHCHECK instruction. require('ws') has no .connect() static
      # method (that's not the ws package's API) -- every check has been
      # throwing and marking the container "unhealthy" regardless of
      # whether it's actually serving connections correctly.
      test: ["CMD", "node", "-e", "const WS = require('ws'); const ws = new WS('ws://localhost:4001'); ws.on('open', () => { ws.close(); process.exit(0); }); ws.on('error', () => process.exit(1)); setTimeout(() => process.exit(1), 5000);"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  iantopia-network:
    driver: bridge
  yt-network:
    external: true
    name: youtube-transcript-app_yt-network
