# iantopia.com on the VM. Same routes as qasim's nginx, served by host nginx
# (nginx is installed by bootstrap.sh and reads this file).
#
#   /                 the Astro site (static files from repo/dist)
#   /arena-ws/        the arena WebSocket server (127.0.0.1:4001)
#   /api/             transcript app backend (127.0.0.1:8000)
#   /transcripts/     transcript app frontend (127.0.0.1:3000)
#   /__/auth          Firebase sign-in helper, same origin as the site

server {
    listen 80 default_server;
    server_name _;

    root /srv/iantopia/repo/dist;
    index index.html;
    client_max_body_size 100M;

    # Arena multiplayer. WebSocket upgrade, and long timeouts so games stay open.
    location /arena-ws/ {
        proxy_pass http://127.0.0.1:4001/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Strubles wallet (HTTP, same server as the arena). Balance changes go through here.
    location /arena-api/ {
        proxy_pass http://127.0.0.1:4001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    # Transcript app.
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /transcripts {
        return 301 /transcripts/;
    }
    location /transcripts/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Firebase sign-in helper (same pattern as qasim; see Firebase's redirect docs).
    location /__/auth {
        proxy_pass https://iantopia.firebaseapp.com;
    }

    # News JSON changes on every pipeline run, so it must never be cached.
    location /news-data/ {
        add_header Cache-Control "no-store";
    }

    # HTML revalidates every time, so a new build shows up straight away.
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }
}
