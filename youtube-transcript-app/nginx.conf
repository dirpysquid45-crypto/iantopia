user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100M;

    upstream frontend {
        server yt-transcript-frontend:3000;
    }

    upstream backend {
        server yt-transcript-backend:8000;
    }

    server {
        listen 80;
        server_name _;

        # API routes - preserve /api/ prefix (backend routes expect it)
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Firebase Auth sign-in helper — makes authDomain same-origin with
        # iantopia.com instead of iantopia.firebaseapp.com, since mobile
        # browsers (Safari ITP, others) block the third-party storage
        # access the popup/redirect handshake otherwise depends on. Exact
        # pattern from Firebase's own docs: only the path prefix + a bare
        # proxy_pass, nothing else — see redirect-best-practices docs.
        location /__/auth {
            proxy_pass https://iantopia.firebaseapp.com;
        }

        # Transcript app routes - strip /transcripts prefix
        location /transcripts/ {
            proxy_pass http://frontend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /transcripts {
            return 301 /transcripts/;
        }

        # news-pipeline's output (public/news-data/ -> dist/news-data/)
        # updates via cron independent of any deploy, unlike the JS/CSS
        # bundles below (which cache-bust via ?v=N when they change). These
        # JSON files are fetched from the same URL every time, so the
        # blanket 1h cache below would leave a browser serving up-to-an-
        # hour-stale digest/headlines/stocks even after a fresh cron run.
        location /news-data/ {
            root /app/astro-dist;
            add_header Cache-Control "no-store";
        }

        # Default: serve Astro homepage from static files
        location / {
            root /app/astro-dist;
            try_files $uri $uri/ /index.html;
            expires 1h;
            add_header Cache-Control "public, max-age=3600";
        }
    }
}
