# Nginx reverse proxy configuration for YouTube Transcript App
# This runs on qasim and handles HTTPS termination + routing

upstream yt_frontend {
    server localhost:3000;
}

upstream yt_backend {
    server localhost:8000;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name transcripts.iantopia.com;
    return 301 https://$server_name$request_uri;
}

# HTTPS server (Cloudflare Tunnel handles encryption)
# Even though Tunnel provides encryption, we listen on 80 internally
# Cloudflare Tunnel connects to this port
server {
    listen 80;
    server_name transcripts.iantopia.com;

    # Disable compression to prevent BREACH attack
    gzip off;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Root location - serve frontend
    location / {
        proxy_pass http://yt_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # API endpoints - route to backend
    location /api/ {
        proxy_pass http://yt_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Health check endpoint for Docker
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
