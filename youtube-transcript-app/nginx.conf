# Nginx reverse proxy configuration for YouTube Transcript App

upstream yt_frontend {
    server frontend:3000;
}

upstream yt_backend {
    server backend:8000;
}

# Main server - no domain checking for local dev + production
server {
    listen 80;

    # Disable compression to prevent BREACH attack
    gzip off;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Root location - serve frontend
    location / {
        proxy_pass http://yt_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # API endpoints - route to backend
    location /api/ {
        proxy_pass http://yt_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Large media assets too big for Cloudflare Pages (>25MB limit)
    location /media/ {
        alias /usr/share/nginx/media/;
        add_header Access-Control-Allow-Origin "https://iantopia.com" always;
        add_header Cache-Control "public, max-age=604800" always;
        autoindex off;
        try_files $uri =404;
    }

    # Error handling for missing media (graceful degradation)
    error_page 404 /404.json;
    location = /404.json {
        internal;
        access_log off;
        default_type application/json;
        return 404 '{"error":"not_found","message":"Media file not found"}';
    }

    # Health check endpoint for Docker (works even if media missing)
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
