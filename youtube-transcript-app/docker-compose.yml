version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8001:8000"
    volumes:
      - transcripts:/app/transcripts
      - downloads:/app/downloads
      - audio:/app/audio
    environment:
      - PYTHONUNBUFFERED=1
    container_name: yt-transcript-backend
    networks:
      - yt-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - HOST=0.0.0.0
    depends_on:
      - backend
    container_name: yt-transcript-frontend
    networks:
      - yt-network

networks:
  yt-network:
    driver: bridge

volumes:
  transcripts:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /Users/solriver/iantopia/youtube-transcript-app/transcripts
  downloads:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /Users/solriver/iantopia/youtube-transcript-app/downloads
  audio:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /Users/solriver/iantopia/youtube-transcript-app/audio
