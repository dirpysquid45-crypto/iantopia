version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - transcripts:/app/transcripts
      - downloads:/app/downloads
      - audio:/app/audio
    environment:
      - PYTHONUNBUFFERED=1
    container_name: yt-transcript-backend

  frontend:
    image: node:20-alpine
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev"
    environment:
      - HOST=0.0.0.0
    depends_on:
      - backend
    container_name: yt-transcript-frontend

volumes:
  transcripts:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /Users/solriver/iantopia/youtube-transcript-app/transcripts
  downloads:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /Users/solriver/iantopia/youtube-transcript-app/downloads
  audio:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /Users/solriver/iantopia/youtube-transcript-app/audio
