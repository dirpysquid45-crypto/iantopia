services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: on-failure:5
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    container_name: yt-transcript-backend
    networks:
      - yt-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 120s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: on-failure:5
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - HOST=0.0.0.0
    depends_on:
      backend:
        condition: service_healthy
    container_name: yt-transcript-frontend
    networks:
      - yt-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 120s

  nginx:
    image: nginx:alpine
    restart: on-failure:5
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - /home/user/iantopia/dist:/app/astro-dist:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    container_name: yt-transcript-nginx
    networks:
      - yt-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 120s

networks:
  yt-network:
    driver: bridge
