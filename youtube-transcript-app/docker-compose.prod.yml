version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./transcripts:/app/transcripts
      - ./downloads:/app/downloads
      - ./audio:/app/audio
    environment:
      - PYTHONUNBUFFERED=1
    container_name: yt-transcript-backend
    networks:
      - yt-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/transcripts"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - HOST=0.0.0.0
    depends_on:
      - backend
    container_name: yt-transcript-frontend
    networks:
      - yt-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    container_name: yt-transcript-nginx
    networks:
      - yt-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  yt-network:
    driver: bridge

volumes:
  transcripts:
  downloads:
  audio:
